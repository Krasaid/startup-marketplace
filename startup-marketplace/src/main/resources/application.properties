cat > ~/Descargas/startup-fase1/startup-marketplace/src/main/resources/application.properties << 'EOF'
# ================================================================
# StartUP! Marketplace — Configuracion Base
# ================================================================
spring.application.name=startup-marketplace

# ---------------------------------------------------------------
# VIRTUAL THREADS
# ---------------------------------------------------------------
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------
# MONGODB — variable de entorno en produccion
# ---------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/startup_db}

# ---------------------------------------------------------------
# JWT — variable de entorno en produccion
# ---------------------------------------------------------------
jwt.secret=${JWT_SECRET:c3RhcnR1cFNlY3JldEtleVBhcmFKV1QyMDI1Q2hhbmdlSW5Qcm9kdWN0aW9u}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------
# SERVIDOR
# ---------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------
# CORS
# ---------------------------------------------------------------
startup.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------
# CACHE
# ---------------------------------------------------------------
spring.cache.type=caffeine

# ---------------------------------------------------------------
# UPLOAD DE IMAGENES
# ---------------------------------------------------------------
startup.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------
# ASYNC
# ---------------------------------------------------------------
spring.task.execution.pool.core-size=0

# ---------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------
logging.level.com.startup=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.scheduling=INFO
EOF