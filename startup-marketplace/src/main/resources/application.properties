# ================================================================
# StartUP! Marketplace — Configuracion Base
# ================================================================

spring.application.name=startup-marketplace

# ---------------------------------------------------------------
# VIRTUAL THREADS — Filosofia "RAM Rapida" para alta concurrencia
# ---------------------------------------------------------------
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------
# MONGODB
# ---------------------------------------------------------------
spring.data.mongodb.uri=mongodb://localhost:27017/startup_db

# ---------------------------------------------------------------
# JWT
# IMPORTANTE: Cambia jwt.secret en produccion.
# Debe ser Base64 de al menos 32 bytes (256 bits).
# Genera uno con: openssl rand -base64 32
# ---------------------------------------------------------------
jwt.secret=c3RhcnR1cFNlY3JldEtleVBhcmFKV1QyMDI1Q2hhbmdlSW5Qcm9kdWN0aW9u
jwt.expiration=86400000

# ---------------------------------------------------------------
# SERVIDOR
# ---------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------
# CORS — Origen del SPA Vue.js (ajustar en produccion)
# ---------------------------------------------------------------
startup.cors.allowed-origins=http://localhost:5173

# ---------------------------------------------------------------
# CACHE — Caffeine
# ---------------------------------------------------------------
spring.cache.type=caffeine

# ---------------------------------------------------------------
# UPLOAD DE IMAGENES
# ---------------------------------------------------------------
startup.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------
logging.level.com.startup=DEBUG
logging.level.org.springframework.security=WARN
